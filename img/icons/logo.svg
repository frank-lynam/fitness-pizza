<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0c1624"/>
    <stop offset="100%" stop-color="#192538"/>
  </linearGradient>

  <!-- Crust band gradient: top warm tan → bottom brown -->
  <linearGradient id="crust-grad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#d4955a"/>
    <stop offset="100%" stop-color="#a06030"/>
  </linearGradient>

  <!-- Cheese base: golden radial -->
  <radialGradient id="cheese-grad" cx="45%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#f5e090"/>
    <stop offset="100%" stop-color="#e8c060"/>
  </radialGradient>

  <!-- Cheese drip -->
  <radialGradient id="drip-grad" cx="40%" cy="30%" r="60%">
    <stop offset="0%" stop-color="#fff8c0"/>
    <stop offset="50%" stop-color="#f5e090"/>
    <stop offset="100%" stop-color="#e8c060"/>
  </radialGradient>

  <!-- Prosciutto piece 1 -->
  <radialGradient id="pros1" cx="45%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#eeaab8"/>
    <stop offset="100%" stop-color="#c86078"/>
  </radialGradient>

  <!-- Prosciutto piece 2 -->
  <radialGradient id="pros2" cx="55%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#eeaab8"/>
    <stop offset="100%" stop-color="#c86078"/>
  </radialGradient>

  <!-- Fig 1 skin -->
  <radialGradient id="fig1-skin" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#b050c8"/>
    <stop offset="100%" stop-color="#501065"/>
  </radialGradient>

  <!-- Fig 1 flesh -->
  <radialGradient id="fig1-flesh" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#d05070"/>
    <stop offset="100%" stop-color="#8a1a38"/>
  </radialGradient>

  <!-- Fig 2 skin -->
  <radialGradient id="fig2-skin" cx="40%" cy="35%" r="60%">
    <stop offset="0%" stop-color="#b050c8"/>
    <stop offset="100%" stop-color="#501065"/>
  </radialGradient>

  <!-- Fig 2 flesh -->
  <radialGradient id="fig2-flesh" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#d05070"/>
    <stop offset="100%" stop-color="#8a1a38"/>
  </radialGradient>

  <!-- Icon surface shine -->
  <radialGradient id="iconShine" cx="28%" cy="18%" r="48%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <!-- Drop shadow filter for the whole slice -->
  <filter id="sliceShadow" x="-16%" y="-10%" width="132%" height="132%">
    <feDropShadow dx="0" dy="6" stdDeviation="10"
                  flood-color="#1a0505" flood-opacity="0.55"/>
  </filter>

  <!-- Subtle shadow for toppings -->
  <filter id="toppingShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="4"
                  flood-color="#1a0505" flood-opacity="0.40"/>
  </filter>

  <!-- Drip glow -->
  <filter id="dripGlow" x="-30%" y="-10%" width="160%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6"
                  flood-color="#c8a020" flood-opacity="0.5"/>
  </filter>

</defs>

<!-- ══ BACKGROUND ══════════════════════════════════════════ -->
<rect width="512" height="512" rx="90" fill="url(#bg)"/>

<!-- ══ PIZZA SLICE (tip pointing DOWN) ══════════════════════
     Tip      : (256, 450)
     Top-left  : (58,  104)
     Top-right : (454, 104)
     Outer arc : M 58,104  Q 256,28  454,104
     Inner arc : M 90,162  Q 256,98  422,162
═══════════════════════════════════════════════════════════ -->

<!-- ── Drop shadow (whole slice) ── -->
<g filter="url(#sliceShadow)">
  <path d="M 58,104 Q 256,28 454,104 L 256,450 Z" fill="#a06030"/>
</g>

<!-- ── Layer 1: Cheese base (golden, from inner crust to tip) ── -->
<path d="M 90,162 Q 256,98 422,162 L 256,450 Z"
      fill="url(#cheese-grad)"/>

<!-- ── Layer 2: Crust band ── -->
<path d="M 58,104 Q 256,28 454,104 L 422,162 Q 256,98 90,162 Z"
      fill="url(#crust-grad)"/>

<!-- Crust bumps: subtle highlight ellipses along the arc -->
<ellipse cx="120" cy="126" rx="22" ry="10" fill="#e8b070" opacity="0.6"
         transform="rotate(-38,120,126)"/>
<ellipse cx="200" cy="104" rx="20" ry="9" fill="#e8b070" opacity="0.6"
         transform="rotate(-18,200,104)"/>
<ellipse cx="286" cy="92" rx="24" ry="10" fill="#e8b070" opacity="0.6"
         transform="rotate(2,286,92)"/>
<ellipse cx="368" cy="103" rx="20" ry="9" fill="#e8b070" opacity="0.6"
         transform="rotate(20,368,103)"/>

<!-- Crust dark blistered spots for baked texture -->
<ellipse cx="148" cy="132" rx="14" ry="7" fill="#6a3010" opacity="0.45"
         transform="rotate(-30,148,132)"/>
<ellipse cx="256" cy="96" rx="16" ry="7" fill="#6a3010" opacity="0.38"
         transform="rotate(0,256,96)"/>
<ellipse cx="378" cy="124" rx="13" ry="7" fill="#6a3010" opacity="0.42"
         transform="rotate(28,378,124)"/>

<!-- Crust outer rim highlight -->
<path d="M 64,110 Q 256,36 448,110"
      fill="none" stroke="#f0c880" stroke-width="4"
      stroke-linecap="round" opacity="0.55"/>


<!-- ══ TOPPINGS ═══════════════════════════════════════════ -->

<!-- ── Prosciutto piece 1 (upper-left ~155,235) ── -->
<g filter="url(#toppingShadow)">
  <path d="M 118,212 C 108,196 124,178 148,182 C 170,186 182,204 178,224
           C 174,242 152,252 132,242 C 114,232 112,222 118,212 Z"
        fill="url(#pros1)"/>
  <!-- Inner fold highlight -->
  <path d="M 122,214 C 114,200 128,184 150,188 C 170,192 180,208 176,226
           C 172,242 152,250 134,241 C 118,232 116,224 122,214 Z"
        fill="none" stroke="#e080a0" stroke-width="2" opacity="0.5"/>
  <!-- Subtle fat marbling lines -->
  <path d="M 130,200 C 140,196 155,198 162,208"
        fill="none" stroke="#f8d0d8" stroke-width="1.5" opacity="0.55"
        stroke-linecap="round"/>
  <path d="M 125,220 C 135,215 148,216 158,224"
        fill="none" stroke="#f8d0d8" stroke-width="1.5" opacity="0.45"
        stroke-linecap="round"/>
</g>

<!-- ── Prosciutto piece 2 (right side ~350,230) ── -->
<g filter="url(#toppingShadow)">
  <path d="M 322,205 C 312,190 328,172 352,176 C 374,180 386,200 380,220
           C 374,240 350,250 330,240 C 312,230 316,218 322,205 Z"
        fill="url(#pros2)"/>
  <!-- Inner fold highlight -->
  <path d="M 326,207 C 318,193 332,177 354,181 C 374,185 384,203 378,221
           C 372,239 350,248 332,239 C 316,231 320,220 326,207 Z"
        fill="none" stroke="#e080a0" stroke-width="2" opacity="0.5"/>
  <!-- Subtle fat marbling lines -->
  <path d="M 334,192 C 344,188 358,190 366,200"
        fill="none" stroke="#f8d0d8" stroke-width="1.5" opacity="0.55"
        stroke-linecap="round"/>
  <path d="M 328,215 C 340,210 354,212 362,220"
        fill="none" stroke="#f8d0d8" stroke-width="1.5" opacity="0.45"
        stroke-linecap="round"/>
</g>

<!-- ── Fig 1 (center-upper ~248,190) ── -->
<g filter="url(#toppingShadow)">
  <!-- Outer skin -->
  <circle cx="248" cy="190" r="42" fill="url(#fig1-skin)"/>
  <!-- Inner flesh (cut surface) -->
  <circle cx="248" cy="190" r="29" fill="url(#fig1-flesh)"/>
  <!-- Seeds in star pattern -->
  <!-- Center -->
  <circle cx="248" cy="190" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <!-- Cardinal + diagonal offset seeds -->
  <circle cx="260" cy="190" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="236" cy="190" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="248" cy="178" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="248" cy="202" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <!-- Diagonal seeds -->
  <circle cx="257" cy="181" r="2.8" fill="#5a0a25" opacity="0.75"/>
  <circle cx="239" cy="199" r="2.8" fill="#5a0a25" opacity="0.75"/>
  <!-- Tiny highlight on skin -->
  <ellipse cx="238" cy="174" rx="10" ry="7" fill="#d080e0" opacity="0.3"
           transform="rotate(-20,238,174)"/>
</g>

<!-- ── Fig 2 (lower, slightly right ~274,358) ── -->
<g filter="url(#toppingShadow)">
  <!-- Outer skin -->
  <circle cx="274" cy="358" r="46" fill="url(#fig2-skin)"/>
  <!-- Inner flesh -->
  <circle cx="274" cy="358" r="32" fill="url(#fig2-flesh)"/>
  <!-- Seeds (6 dots + center) -->
  <circle cx="274" cy="358" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="287" cy="358" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="261" cy="358" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="274" cy="345" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="274" cy="371" r="3.5" fill="#5a0a25" opacity="0.85"/>
  <circle cx="284" cy="348" r="2.8" fill="#5a0a25" opacity="0.75"/>
  <circle cx="264" cy="368" r="2.8" fill="#5a0a25" opacity="0.75"/>
  <!-- Tiny highlight on skin -->
  <ellipse cx="262" cy="341" rx="11" ry="8" fill="#d080e0" opacity="0.28"
           transform="rotate(-20,262,341)"/>
</g>

<!-- ── Arugula leaves ── -->
<!-- Leaf at ~(200,278) -->
<g opacity="0.9">
  <path d="M 200,268 C 194,274 192,282 200,288 C 208,282 208,274 200,268 Z"
        fill="#3a9848"/>
  <path d="M 200,268 C 196,273 196,281 200,288"
        fill="none" stroke="#2a7838" stroke-width="1" opacity="0.7"/>
  <!-- Side lobes -->
  <path d="M 198,275 C 190,273 188,279 193,281"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 201,281 C 210,279 212,285 207,287"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</g>

<!-- Leaf at ~(310,295) -->
<g opacity="0.9" transform="rotate(15,310,295)">
  <path d="M 310,285 C 304,291 302,299 310,305 C 318,299 318,291 310,285 Z"
        fill="#3a9848"/>
  <path d="M 310,285 C 306,290 306,298 310,305"
        fill="none" stroke="#2a7838" stroke-width="1" opacity="0.7"/>
  <path d="M 308,292 C 300,290 298,296 303,298"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 311,298 C 320,296 322,302 317,304"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</g>

<!-- Leaf at ~(245,335) -->
<g opacity="0.9" transform="rotate(-25,245,335)">
  <path d="M 245,325 C 239,331 237,339 245,345 C 253,339 253,331 245,325 Z"
        fill="#3a9848"/>
  <path d="M 245,325 C 241,330 241,338 245,345"
        fill="none" stroke="#2a7838" stroke-width="1" opacity="0.7"/>
  <path d="M 243,332 C 235,330 233,336 238,338"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 246,338 C 255,336 257,342 252,344"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</g>

<!-- Leaf at ~(175,310) -->
<g opacity="0.9" transform="rotate(30,175,310)">
  <path d="M 175,300 C 169,306 167,314 175,320 C 183,314 183,306 175,300 Z"
        fill="#3a9848"/>
  <path d="M 175,300 C 171,305 171,313 175,320"
        fill="none" stroke="#2a7838" stroke-width="1" opacity="0.7"/>
  <path d="M 173,307 C 165,305 163,311 168,313"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 176,313 C 185,311 187,317 182,319"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</g>

<!-- Leaf at ~(330,245) -->
<g opacity="0.9" transform="rotate(-10,330,245)">
  <path d="M 330,235 C 324,241 322,249 330,255 C 338,249 338,241 330,235 Z"
        fill="#3a9848"/>
  <path d="M 330,235 C 326,240 326,248 330,255"
        fill="none" stroke="#2a7838" stroke-width="1" opacity="0.7"/>
  <path d="M 328,242 C 320,240 318,246 323,248"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M 331,248 C 340,246 342,252 337,254"
        fill="none" stroke="#3a9848" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
</g>

<!-- ── Olive oil drizzle ── -->
<path d="M 170,245 C 190,258 195,272 215,278 C 235,284 248,278 265,288"
      stroke="#c8a020" stroke-width="4" fill="none" opacity="0.65"
      stroke-linecap="round"/>

<!-- ── Cheese drip at tip ── -->
<g filter="url(#dripGlow)">
  <path d="M 246,449 C 237,453 231,466 232,478 C 233,490 243,501 256,502
           C 269,501 279,490 280,478 C 281,466 275,453 266,449 Z"
        fill="url(#drip-grad)"/>
  <!-- Drip inner highlight -->
  <ellipse cx="247" cy="466" rx="7" ry="13" fill="white" opacity="0.25"
           transform="rotate(-8,247,466)"/>
</g>

<!-- Thin cheese strings at tip -->
<path d="M 251,447 C 249,450 248,454 248,458"
      stroke="#e8c060" stroke-width="3" fill="none"
      stroke-linecap="round" opacity="0.7"/>
<path d="M 261,447 C 263,450 264,454 264,458"
      stroke="#e8c060" stroke-width="2.5" fill="none"
      stroke-linecap="round" opacity="0.6"/>


<!-- ══ FINISHING TOUCHES ════════════════════════════════════ -->

<!-- Subtle dark edge on the two cut sides of the slice -->
<path d="M 58,104 L 256,450" stroke="#5a2a06" stroke-width="2" opacity="0.35"/>
<path d="M 454,104 L 256,450" stroke="#5a2a06" stroke-width="2" opacity="0.35"/>

<!-- Icon surface sheen overlay -->
<rect width="512" height="512" rx="90" fill="url(#iconShine)"/>

</svg>
