<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0c1624"/>
    <stop offset="100%" stop-color="#192538"/>
  </linearGradient>

  <!-- Crust: warm baked tan → dark brown -->
  <linearGradient id="crustFill" x1="20%" y1="0%" x2="80%" y2="100%">
    <stop offset="0%"   stop-color="#f2c26e"/>
    <stop offset="48%"  stop-color="#d08a28"/>
    <stop offset="100%" stop-color="#8c5012"/>
  </linearGradient>

  <!-- Crust outer rim (lighter, facing "up") -->
  <linearGradient id="crustRim" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ffe898"/>
    <stop offset="100%" stop-color="#cf8020"/>
  </linearGradient>

  <!-- Sauce: deep red -->
  <radialGradient id="sauceFill" cx="50%" cy="26%" r="74%">
    <stop offset="0%"   stop-color="#e83c1c"/>
    <stop offset="60%"  stop-color="#c01408"/>
    <stop offset="100%" stop-color="#880c04"/>
  </radialGradient>

  <!-- Cheese: rich golden yellow -->
  <radialGradient id="cheeseFill" cx="40%" cy="32%" r="64%">
    <stop offset="0%"   stop-color="#ffe86a"/>
    <stop offset="48%"  stop-color="#f4be0c"/>
    <stop offset="100%" stop-color="#be7c00"/>
  </radialGradient>

  <!-- Cheese drip: brighter, more saturated -->
  <radialGradient id="dripFill" cx="36%" cy="28%" r="58%">
    <stop offset="0%"   stop-color="#fff8b8"/>
    <stop offset="50%"  stop-color="#f8ca10"/>
    <stop offset="100%" stop-color="#d09400"/>
  </radialGradient>

  <!-- Pepperoni: dark core → vivid red surface -->
  <radialGradient id="pepFill" cx="34%" cy="30%" r="58%">
    <stop offset="0%"   stop-color="#ec3030"/>
    <stop offset="52%"  stop-color="#b01212"/>
    <stop offset="100%" stop-color="#660606"/>
  </radialGradient>

  <!-- Warm ambient glow -->
  <radialGradient id="warmGlow" cx="50%" cy="54%" r="50%">
    <stop offset="0%"   stop-color="#d86010" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#d86010" stop-opacity="0"/>
  </radialGradient>

  <!-- Icon surface shine -->
  <radialGradient id="iconShine" cx="28%" cy="18%" r="48%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <!-- Drip inner highlight -->
  <radialGradient id="dripHighlight" cx="32%" cy="28%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>

  <!-- ── FILTERS ── (only simple drop shadows, no displacement maps) -->

  <filter id="sliceShadow" x="-14%" y="-10%" width="128%" height="130%">
    <feDropShadow dx="0" dy="10" stdDeviation="22"
                  flood-color="#000000" flood-opacity="0.72"/>
  </filter>

  <filter id="pepShadow" x="-24%" y="-24%" width="148%" height="148%">
    <feDropShadow dx="1" dy="2.5" stdDeviation="3.5"
                  flood-color="#000000" flood-opacity="0.55"/>
  </filter>

  <filter id="dripGlow" x="-30%" y="-10%" width="160%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="7"
                  flood-color="#d09000" flood-opacity="0.6"/>
  </filter>

</defs>

<!-- ══ BACKGROUND ══════════════════════════════════════════ -->
<rect width="512" height="512" rx="90" fill="url(#bg)"/>

<!-- Warm ambient glow from the pizza -->
<ellipse cx="256" cy="300" rx="230" ry="210" fill="url(#warmGlow)"/>


<!-- ══ PIZZA SLICE (tip pointing DOWN) ══════════════════════
     Geometry:
       Tip          : (256, 450)
       Left corner  : (58,  104)
       Right corner : (454, 104)
       Outer arc    : M 58,104  Q 256,28  454,104     (peak at y=28)
       Crust inner  : M 90,162  Q 256,98  422,162     (peak at y=98)
       Cheese inner : M 112,168 ─────── 400,168 → 256,444
═══════════════════════════════════════════════════════════ -->

<!-- Drop shadow rendered first, below everything -->
<path d="M 58,104 Q 256,28 454,104 L 256,450 Z"
      fill="#a05808" opacity="0.4" filter="url(#sliceShadow)"/>

<!-- ── Layer 1: Sauce (fills the full triangle) ── -->
<path d="M 58,104 Q 256,28 454,104 L 256,450 Z"
      fill="url(#sauceFill)"/>

<!-- ── Layer 2: Crust band ── -->
<path d="M 58,104  Q 256,28  454,104
         L 422,162 Q 256,98   90,162 Z"
      fill="url(#crustFill)"/>

<!-- Crust outer rim: bright highlight line along the arc -->
<path d="M 62,108 Q 256,36 450,108"
      fill="none"
      stroke="url(#crustRim)" stroke-width="5"
      stroke-linecap="round" opacity="0.65"/>

<!-- Crust dark blisters (hand-placed, no filters, scales well) -->
<ellipse cx="122" cy="130" rx="16" ry="9"  fill="#5e2a08" opacity="0.58" transform="rotate(-40,122,130)"/>
<ellipse cx="190" cy="109" rx="15" ry="8"  fill="#5e2a08" opacity="0.52" transform="rotate(-20,190,109)"/>
<ellipse cx="268" cy="95"  rx="19" ry="8"  fill="#5e2a08" opacity="0.46" transform="rotate( 4,268, 95)"/>
<ellipse cx="340" cy="106" rx="15" ry="8"  fill="#5e2a08" opacity="0.52" transform="rotate(22,340,106)"/>
<ellipse cx="406" cy="128" rx="15" ry="9"  fill="#5e2a08" opacity="0.58" transform="rotate(42,406,128)"/>

<!-- Crust golden highlight bubbles -->
<ellipse cx="156" cy="120" rx="9"  ry="5" fill="#fcd880" opacity="0.52" transform="rotate(-30,156,120)"/>
<ellipse cx="256" cy="100" rx="11" ry="5" fill="#fcd880" opacity="0.46"/>
<ellipse cx="354" cy="118" rx="9"  ry="5" fill="#fcd880" opacity="0.52" transform="rotate(30,354,118)"/>

<!-- ── Layer 3: Cheese ── -->
<path d="M 112,168 L 400,168 L 256,444 Z"
      fill="url(#cheeseFill)"/>

<!-- Cheese surface highlight (soft bright spot, upper-left quadrant) -->
<ellipse cx="212" cy="270" rx="88" ry="54"
         fill="#fff8d0" opacity="0.20"
         transform="rotate(-17,212,270)"/>

<!-- Cheese browned bubble spots (gives melted texture without filters) -->
<ellipse cx="168" cy="298" rx="14" ry="9"  fill="#b07a06" opacity="0.35" transform="rotate(-12,168,298)"/>
<ellipse cx="332" cy="290" rx="13" ry="8"  fill="#b07a06" opacity="0.32" transform="rotate( 14,332,290)"/>
<ellipse cx="242" cy="390" rx="11" ry="7"  fill="#b07a06" opacity="0.28" transform="rotate( -4,242,390)"/>

<!-- Sauce edge bleed (tiny strips of red visible at cheese edges) -->
<!-- Handled naturally since sauce layer sits behind cheese -->


<!-- ══ PEPPERONI (3, triangle arrangement) ════════════════
     A: upper-left   (194, 232)  r=32
     B: upper-right  (316, 240)  r=30
     C: lower-center (256, 318)  r=35
═════════════════════════════════════════════════════════ -->

<!-- Pepperoni A -->
<g filter="url(#pepShadow)">
  <circle cx="194" cy="232" r="36" fill="#540404"/>
  <circle cx="194" cy="232" r="32" fill="url(#pepFill)"/>
  <ellipse cx="184" cy="222" rx="12" ry="8.5"
           fill="#f04040" opacity="0.50" transform="rotate(-22,184,222)"/>
  <!-- Char spots -->
  <circle cx="207" cy="245" r="5.5"  fill="#360202" opacity="0.78"/>
  <circle cx="183" cy="244" r="4"    fill="#360202" opacity="0.68"/>
  <circle cx="205" cy="218" r="3.5"  fill="#360202" opacity="0.68"/>
  <!-- Grease halo -->
  <circle cx="194" cy="232" r="36"
          fill="none" stroke="#f8c212" stroke-width="2.5" opacity="0.32"/>
</g>

<!-- Pepperoni B -->
<g filter="url(#pepShadow)">
  <circle cx="316" cy="240" r="34" fill="#540404"/>
  <circle cx="316" cy="240" r="30" fill="url(#pepFill)"/>
  <ellipse cx="306" cy="231" rx="11" ry="8"
           fill="#f04040" opacity="0.50" transform="rotate(-22,306,231)"/>
  <circle cx="328" cy="253" r="5"   fill="#360202" opacity="0.78"/>
  <circle cx="306" cy="252" r="3.5" fill="#360202" opacity="0.68"/>
  <circle cx="325" cy="226" r="3.5" fill="#360202" opacity="0.68"/>
  <circle cx="316" cy="240" r="34"
          fill="none" stroke="#f8c212" stroke-width="2.5" opacity="0.32"/>
</g>

<!-- Pepperoni C -->
<g filter="url(#pepShadow)">
  <circle cx="256" cy="318" r="39" fill="#540404"/>
  <circle cx="256" cy="318" r="35" fill="url(#pepFill)"/>
  <ellipse cx="245" cy="307" rx="13" ry="9.5"
           fill="#f04040" opacity="0.50" transform="rotate(-22,245,307)"/>
  <circle cx="270" cy="333" r="6"   fill="#360202" opacity="0.78"/>
  <circle cx="245" cy="332" r="4.5" fill="#360202" opacity="0.68"/>
  <circle cx="268" cy="303" r="4"   fill="#360202" opacity="0.68"/>
  <circle cx="256" cy="318" r="39"
          fill="none" stroke="#f8c212" stroke-width="2.5" opacity="0.32"/>
</g>


<!-- ══ CHEESE DRIP (the hero element) ════════════════════
     Tip at (256, 450). Drip hangs below into clear space.
     Teardrop: attaches ~20px wide at the tip, swells to
     ~46px at mid-body, tapers to a rounded point at y≈500.
════════════════════════════════════════════════════════ -->
<g filter="url(#dripGlow)">
  <!-- Drip body -->
  <path d="M 246,449
           C 237,453 231,465 232,477
           C 233,489 243,500 256,501
           C 269,500 279,489 280,477
           C 281,465 275,453 266,449 Z"
        fill="url(#dripFill)"/>
  <!-- Inner highlight — top-left bright spot -->
  <ellipse cx="246" cy="465" rx="8" ry="14"
           fill="url(#dripHighlight)" opacity="0.7"
           transform="rotate(-8,246,465)"/>
</g>

<!-- Thin cheese strings connecting slice tip to drip blob -->
<path d="M 251,447 C 249,450 248,454 248,458"
      stroke="#f8ca10" stroke-width="3.5" fill="none"
      stroke-linecap="round" opacity="0.75"/>
<path d="M 261,447 C 263,450 264,454 264,458"
      stroke="#f4bc08" stroke-width="2.5" fill="none"
      stroke-linecap="round" opacity="0.65"/>


<!-- ══ FINISHING TOUCHES ══════════════════════════════════ -->

<!-- Subtle dark edge on the two cut sides of the slice -->
<path d="M 58,104 L 256,450" stroke="#7a3a06" stroke-width="2.5" opacity="0.4"/>
<path d="M 454,104 L 256,450" stroke="#7a3a06" stroke-width="2.5" opacity="0.4"/>

<!-- Icon surface sheen overlay -->
<rect width="512" height="512" rx="90" fill="url(#iconShine)"/>

</svg>
